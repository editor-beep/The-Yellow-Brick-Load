kind = "web"
previewPath = "/"
title = "The Yellow Brick Load"
version = "1.0.0"
id = "artifacts/yellow-brick-load"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25595

[services.development]
run = "pnpm --filter @workspace/yellow-brick-load run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yellow-brick-load", "run", "build" ]
publicDir = "artifacts/yellow-brick-load/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25595"
BASE_PATH = "/"
